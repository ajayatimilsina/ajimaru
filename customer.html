<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Customer</title>
</head>
<body>
  <p>Redirecting to ordering page…</p>

  <script>
    (function () {
      try {
        // ?t=1 ～ ?t=40
        const params = new URLSearchParams(location.search);
        const queryTable = params.get('t');

        // #t=1 ～ #t=40
        const hashMatch = location.hash.match(/(?:^|[&#])t=(\d+)/);
        const hashTable = hashMatch ? hashMatch[1] : null;

        // Table number
        const tableNo = Number(queryTable || hashTable || 1);

        // Only Table 1～40
        const table = Math.min(
          40,
          Math.max(1, Number.isFinite(tableNo) ? tableNo : 1)
        );

        // Open index.html with selected table
        const dest = new URL('index.html', location.href);
        dest.hash = 't=' + table + '&fixed=1';

        location.replace(dest.toString());

      } catch (e) {
        location.replace('index.html');
      }
    })();
  </script>
</body>
</html>
